---
apiVersion: operator.openshift.io/v1alpha1
kind: ImageDigestMirrorSet
metadata:
  name: aws-load-balancer-operator-mirrors
spec:
  imageDigestMirrors:
    # UBI base images
    - source: registry.redhat.io/ubi9/ubi
      mirrors:
        - brew.registry.redhat.io/ubi9/ubi
    - source: registry.redhat.io/ubi9/ubi-minimal
      mirrors:
        - brew.registry.redhat.io/ubi9/ubi-minimal
    - source: registry.redhat.io/ubi9/ubi-micro
      mirrors:
        - brew.registry.redhat.io/ubi9/ubi-micro
    - source: registry.redhat.io/ubi8/ubi
      mirrors:
        - brew.registry.redhat.io/ubi8/ubi
    - source: registry.redhat.io/ubi8/ubi-minimal
      mirrors:
        - brew.registry.redhat.io/ubi8/ubi-minimal
    - source: registry.redhat.io/ubi8/ubi-micro
      mirrors:
        - brew.registry.redhat.io/ubi8/ubi-micro
    # ALBO Bundle - production registry
    - source: registry.redhat.io/albo/aws-load-balancer-operator-bundle
      mirrors:
        - quay.io/redhat-user-workloads/aws-load-balancer-operator-tenant/aws-lb-optr-1-2-rhel-8/aws-lb-bundle-container-aws-lb-optr-1-2-rhel-8
        - quay.io/redhat-user-workloads/aws-load-balancer-operator-tenant/aws-lb-optr-1-3-rhel-9/aws-lb-bundle-container-aws-lb-optr-1-3-rhel-9
    # ALBO Operator - production registry
    - source: registry.redhat.io/albo/aws-load-balancer-rhel8-operator
      mirrors:
        - quay.io/redhat-user-workloads/aws-load-balancer-operator-tenant/aws-lb-optr-1-2-rhel-8/aws-load-balancer-operator-container-aws-lb-optr-1-2-rhel-8
    - source: registry.redhat.io/albo/aws-load-balancer-rhel9-operator
      mirrors:
        - quay.io/redhat-user-workloads/aws-load-balancer-operator-tenant/aws-lb-optr-1-3-rhel-9/aws-load-balancer-operator-container-aws-lb-optr-1-3-rhel-9
    # ALBO Controller - production registry
    - source: registry.redhat.io/albo/aws-load-balancer-controller-rhel8
      mirrors:
        - quay.io/redhat-user-workloads/aws-load-balancer-operator-tenant/aws-lb-optr-1-2-rhel-8/aws-load-balancer-controller-container-aws-lb-optr-1-2-rhel-8
    - source: registry.redhat.io/albo/aws-load-balancer-controller-rhel9
      mirrors:
        - quay.io/redhat-user-workloads/aws-load-balancer-operator-tenant/aws-lb-optr-1-3-rhel-9/aws-load-balancer-controller-container-aws-lb-optr-1-3-rhel-9
    # ALBO Bundle - stage registry
    - source: registry.stage.redhat.io/albo/aws-load-balancer-operator-bundle
      mirrors:
        - quay.io/redhat-user-workloads/aws-load-balancer-operator-tenant/aws-lb-optr-1-2-rhel-8/aws-lb-bundle-container-aws-lb-optr-1-2-rhel-8
        - quay.io/redhat-user-workloads/aws-load-balancer-operator-tenant/aws-lb-optr-1-3-rhel-9/aws-lb-bundle-container-aws-lb-optr-1-3-rhel-9
    # ALBO Operator - stage registry
    - source: registry.stage.redhat.io/albo/aws-load-balancer-rhel8-operator
      mirrors:
        - quay.io/redhat-user-workloads/aws-load-balancer-operator-tenant/aws-lb-optr-1-2-rhel-8/aws-load-balancer-operator-container-aws-lb-optr-1-2-rhel-8
    - source: registry.stage.redhat.io/albo/aws-load-balancer-rhel9-operator
      mirrors:
        - quay.io/redhat-user-workloads/aws-load-balancer-operator-tenant/aws-lb-optr-1-3-rhel-9/aws-load-balancer-operator-container-aws-lb-optr-1-3-rhel-9
    # ALBO Controller - stage registry
    - source: registry.stage.redhat.io/albo/aws-load-balancer-controller-rhel8
      mirrors:
        - quay.io/redhat-user-workloads/aws-load-balancer-operator-tenant/aws-lb-optr-1-2-rhel-8/aws-load-balancer-controller-container-aws-lb-optr-1-2-rhel-8
    - source: registry.stage.redhat.io/albo/aws-load-balancer-controller-rhel9
      mirrors:
        - quay.io/redhat-user-workloads/aws-load-balancer-operator-tenant/aws-lb-optr-1-3-rhel-9/aws-load-balancer-controller-container-aws-lb-optr-1-3-rhel-9
